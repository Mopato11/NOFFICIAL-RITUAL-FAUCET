<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Unofficial Faucet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root { 
            --neon-green: #0d5c3a; /* لون أخضر داكن متناسق مع الخلفية الفاتحة */
            --bg-color: #f4f1ea; /* اللون البيج الدافئ المستوحى من صورتك */
            --card-bg: #ffffff; 
            --text-main: #2b2b2b;
            --border-color: rgba(13, 92, 58, 0.15);
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; display: flex; align-items: center; justify-content: center; 
        }
        
        /* البرق تم تفتيحه ليناسب الخلفية الجديدة بشكل ناعم */
        #lightning-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 1; opacity: 0.15; 
        }
        
        /* الصندوق الأبيض الفخم والمريح */
        .faucet-box { 
            position: relative; z-index: 10; 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 45px 35px; border-radius: 16px; 
            width: 400px; text-align: center; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); 
            border-top: 5px solid var(--neon-green);
        }
        
        .brand-logo { 
            width: 90px; height: 90px; border-radius: 50%; 
            border: 2px solid var(--neon-green); padding: 5px;
            margin-bottom: 20px; 
        }
        
        h1 { 
            font-size: 20px; font-weight: 700; letter-spacing: 1px; 
            color: var(--text-main); margin: 0 0 5px 0; text-transform: uppercase; 
        }
        
        .subtitle { 
            font-size: 11px; color: var(--neon-green); 
            letter-spacing: 1px; margin-bottom: 35px; font-weight: 600;
        }
        
        .input-group { position: relative; margin-bottom: 20px; }
        
        input { 
            width: 100%; padding: 16px 20px; background: #faf9f6; 
            border: 1px solid #e4e1da; border-radius: 8px; 
            color: var(--text-main); font-size: 14px; outline: none; text-align: center; 
            box-sizing: border-box; transition: all 0.3s ease; 
        }
        input:focus { 
            border-color: var(--neon-green); 
            background: #ffffff;
            box-shadow: 0 0 10px rgba(13, 92, 58, 0.05);
        }
        ::placeholder { color: #999999; font-size: 13px; }
        
        .btn-submit { 
            width: 100%; padding: 16px; background: var(--neon-green); 
            color: #ffffff; font-weight: 700; font-size: 15px; 
            border: none; border-radius: 8px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; 
        }
        .btn-submit:hover { 
            background: #1b7a51; 
            transform: translateY(-1px); 
        }
        .btn-submit:disabled { 
            background: #cccccc; color: #ffffff; cursor: not-allowed; transform: none; 
        }
        
        #status-msg { font-size: 12px; margin-top: 20px; color: #888888; font-weight: 500; }
        
        /* الشموع الكلاسيكية المريحة بأسفل الموقع */
        .candles-floor { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            display: flex; justify-content: space-around; z-index: 5; 
            align-items: flex-end; height: 60px; pointer-events: none;
        }
        .candle-stick { width: 8px; background: linear-gradient(to top, #e4e1da, #ffffff); position: relative; border-radius: 2px 2px 0 0; }
        .candle-wick { 
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%); 
            width: 6px; height: 14px; background: radial-gradient(circle, #ffffff, #ffaa00, transparent); 
            border-radius: 50%; filter: blur(0.5px); 
            animation: flameWobble 0.15s infinite alternate; 
        }
        @keyframes flameWobble { 
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.8; } 
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; } 
        }

        /* نافذة التنبيهات الداخلية المخصصة (Custom Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .modal-box {
            background: white; padding: 30px; border-radius: 12px;
            width: 320px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: scale(0.9); transition: 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-weight: 700; font-size: 16px; margin-bottom: 10px; color: #d32f2f; }
        .modal-text { font-size: 13px; color: #555555; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn {
            background: var(--text-main); color: white; border: none;
            padding: 10px 24px; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>

    <canvas id="lightning-canvas"></canvas>
    
    <div class="faucet-box">
        <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="brand-logo" alt="Ritual">
        <h1>Ritual</h1>
        <div class="subtitle">UNOFFICIAL FAUCET</div>
        
        <div class="input-group">
            <input type="text" id="targetWallet" placeholder="Enter Destination Wallet (0x...)">
        </div>
        <div class="input-group">
            <input type="text" id="accessName" placeholder="Enter Your Access Name">
        </div>
        
        <button class="btn-submit" id="actionBtn" onclick="processClaim()">Request 0.002 RITL</button>
        
        <div id="status-msg">Portal Secure & Ready</div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Alert</div>
            <div class="modal-text" id="modalText">Message goes here.</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div class="candles-floor" id="candlesZone"></div>

    <script>
        // النوافذ الداخلية بديلة الـ alert
        function showModal(title, text, isSuccess = false) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalTitle').style.color = isSuccess ? "#0d5c3a" : "#d32f2f";
            document.getElementById('modalText').innerText = text;
            document.getElementById('customModal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        // تأثير الحركة الخلفية الناعمة
        const canvas = document.getElementById('lightning-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function renderLightning() {
            ctx.fillStyle = 'rgba(244, 241, 234, 0.12)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if(Math.random() > 0.98) {
                ctx.strokeStyle = 'rgba(13, 92, 58, 0.3)'; ctx.lineWidth = 1; ctx.beginPath();
                let startX = Math.random() * canvas.width; ctx.moveTo(startX, 0);
                for(let i=0; i<6; i++) {
                    startX += (Math.random() - 0.5) * 40;
                    ctx.lineTo(startX, (canvas.height / 6) * (i + 1));
                }
                ctx.stroke();
            }
            requestAnimationFrame(renderLightning);
        }
        renderLightning();

        // توزيع الشموع المريحة بالأسفل
        const zone = document.getElementById('candlesZone');
        const totalCandles = Math.floor(window.innerWidth / 40);
        for(let i=0; i<totalCandles; i++) {
            const randomHeight = Math.floor(15 + Math.random() * 20);
            zone.innerHTML += `<div class="candle-stick" style="height: ${randomHeight}px;"><div class="candle-wick"></div></div>`;
        }

        // الإعدادات البرمجية
        const VAULT_KEY = "a9946a7810401a1555f0399ff8d28ca19822506fd7a6b969ee3de11761e40d95";
        const NODE_RPC = "https://rpc.ritualfoundation.org/";
        const ALLOWED_NAMES = ["jez", "dunken", "josh", "flash", "stefan"];

        async function processClaim() {
            const walletAddr = document.getElementById('targetWallet').value.trim();
            const inputName = document.getElementById('accessName').value.toLowerCase().trim();
            const msgStatus = document.getElementById('status-msg');
            const submitBtn = document.getElementById('actionBtn');

            if (!ALLOWED_NAMES.includes(inputName)) {
                return showModal("Access Denied", "Your name is not registered in the ritual list.");
            }

            if (!ethers.utils.isAddress(walletAddr)) {
                return showModal("Invalid Address", "Please enter a valid Ritual wallet address.");
            }

            const lastClaimTime = localStorage.getItem('lock_' + walletAddr);
            const currentTime = Date.now();
            if (lastClaimTime && (currentTime - lastClaimTime) < 24 * 60 * 60 * 1000) {
                const remainingHours = Math.ceil((24 * 60 * 60 * 1000 - (currentTime - lastClaimTime)) / (60 * 60 * 1000));
                return showModal("Locked", `This wallet has already claimed today. Try again in ${remainingHours} hours.`);
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Processing Tx...";
                msgStatus.innerText = "Connecting to network...";

                const provider = new ethers.providers.JsonRpcProvider(NODE_RPC);
                const walletSigner = new ethers.Wallet(VAULT_KEY, provider);

                msgStatus.innerText = "Sending 0.002 RITL to your wallet...";
                
                // تم تعديل القيمة هنا بدقة لتصبح 0.002 فقط
                const txResponse = await walletSigner.sendTransaction({
                    to: walletAddr,
                    value: ethers.utils.parseEther("0.002")
                });

                msgStatus.innerText = "Confirming blocks on-chain...";
                await txResponse.wait();

                localStorage.setItem('lock_' + walletAddr, Date.now());

                showModal("Success", "0.002 RITL successfully dispatched.", true);
                msgStatus.innerText = "Ritual successfully completed.";
                submitBtn.innerText = "Claimed Successfully";
            } catch (error) {
                console.error(error);
                showModal("Execution Error", "Transaction failed. Check main vault funding or network status.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Request 0.002 RITL";
                msgStatus.innerText = "Execution failed.";
            }
        }
    </script>
</body>
</html>
