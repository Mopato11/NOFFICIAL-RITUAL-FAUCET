<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Unofficial Faucet</title>
    <style>
        :root { 
            --neon-green: #0d5c3a; 
            --bright-neon: #00ff88; 
            --bg-color: #f4f1ea; 
            --card-bg: #ffffff; 
            --text-main: #2b2b2b;
            --border-color: rgba(13, 92, 58, 0.15);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; display: flex; align-items: center; justify-content: center; 
        }
        #fx-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .faucet-box { 
            position: relative; z-index: 10; background: var(--card-bg); border: 1px solid var(--border-color); 
            padding: 45px 35px; border-radius: 16px; width: 420px; text-align: center; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); border-top: 5px solid var(--neon-green);
        }
        .brand-logo { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--neon-green); padding: 5px; margin-bottom: 20px; animation: logoRotate 6s infinite linear; }
        @keyframes logoRotate { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }
        h1 { font-size: 24px; font-weight: 700; color: var(--text-main); margin: 0; text-transform: uppercase; }
        .subtitle { font-size: 14px; color: var(--neon-green); letter-spacing: 1.5px; margin-bottom: 35px; font-weight: 700; }
        .input-group { position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 16px 20px; background: #faf9f6; border: 1px solid #e4e1da; border-radius: 8px; color: var(--text-main); font-size: 14px; outline: none; text-align: center; box-sizing: border-box; }
        input:focus { border-color: var(--neon-green); background: #ffffff; }
        .btn-submit { width: 100%; padding: 16px; background: var(--neon-green); color: #ffffff; font-weight: 700; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-submit:disabled { background: #cccccc; cursor: not-allowed; }
        #status-msg { font-size: 15px; margin-top: 25px; color: var(--text-main); font-weight: 700; }
        .credits-msg { font-size: 12px; margin-top: 6px; color: #666666; font-weight: 600; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s ease; }
        .modal-box { background: white; padding: 30px; border-radius: 12px; width: 320px; text-align: center; transform: scale(0.9); transition: 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-weight: 700; font-size: 16px; margin-bottom: 10px; }
        .modal-text { font-size: 13px; color: #555555; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn { background: var(--text-main); color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>
    
    <div class="faucet-box">
        <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="brand-logo" alt="Ritual">
        <h1>Ritual</h1>
        <div class="subtitle">UNOFFICIAL FAUCET</div>
        
        <div class="input-group">
            <input type="text" id="targetWallet" placeholder="Enter your wallet">
        </div>
        <div class="input-group">
            <input type="text" id="accessName" placeholder="Enter secret words">
        </div>
        
        <button class="btn-submit" id="actionBtn" onclick="processClaim()">Get 0.002 RTL</button>
        
        <div id="status-msg">Stay Ritualized</div>
        <div class="credits-msg">Made by LiTEino</div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Alert</div>
            <div class="modal-text" id="modalText">Message goes here.</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        function showModal(title, text, isSuccess = false) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalTitle').style.color = isSuccess ? "#0d5c3a" : "#d32f2f";
            document.getElementById('modalText').innerText = text;
            document.getElementById('customModal').classList.add('active');
        }
        function closeModal() { document.getElementById('customModal').classList.remove('active'); }

        // كود تشغيل التأثيرات البصرية للـ Canvas المطر الملون
        const canvas = document.getElementById('fx-canvas'); const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        const snowflakes = []; for (let i = 0; i < 45; i++) { snowflakes.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, radius: Math.random() * 2.5 + 1, density: Math.random() * 0.5 + 0.2 }); }
        function renderVisuals() { ctx.fillStyle = 'rgba(244, 241, 234, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = 'rgba(0, 255, 136, 0.4)'; ctx.beginPath(); for (let i = 0; i < 45; i++) { const f = snowflakes[i]; ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2, true); f.y += f.density; if (f.y > canvas.height) { snowflakes[i] = { x: Math.random() * canvas.width, y: -10, radius: f.radius, density: f.density }; } } ctx.fill(); requestAnimationFrame(renderVisuals); }
        renderVisuals();

        async function processClaim() {
            const walletAddr = document.getElementById('targetWallet').value.trim();
            const inputName = document.getElementById('accessName').value.trim();
            const msgStatus = document.getElementById('status-msg');
            const submitBtn = document.getElementById('actionBtn');

            if (!walletAddr || !inputName) {
                return showModal("Failed", "Please fill in all fields.");
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Processing...";
                msgStatus.innerText = "Sending request to secure server...";

                // إرسال الطلب إلى السيرفر الخلفي الآمن بدون كشف أي برودكاست أو برايفت كي
                const response = await fetch('/api/faucet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ wallet: walletAddr, secret: inputName })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Server Error");
                }

                showModal("Success", "Congrats! You received 0.002 RTL", true);
                msgStatus.innerText = "Stay Ritualized";
                submitBtn.innerText = "Claimed Successfully";
            } catch (error) {
                showModal("Failed", error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Get 0.002 RTL";
                msgStatus.innerText = "Stay Ritualized";
            }
        }
    </script>
</body>
</html>
